; systemd drop-in for miniupnpd.service — deploy to
; /etc/systemd/system/miniupnpd.service.d/override.conf
;
; Runs a copy of manage-upnp-nft.sh (repo root — keep the two in sync)
; before miniupnpd starts, so the nftables chains it needs actually
; exist. See that script for why this is necessary — the vendor's own
; init script silently skips creating them on this router.
;
; The copy must live outside /home: miniupnpd.service runs with
; ProtectHome=yes, which hides /home entirely from it, so a script at
; its normal repo path would fail with "Permission denied".
[Unit]
After=nftables.service
Wants=nftables.service

[Service]
ExecStartPre=/usr/bin/bash /etc/miniupnpd/vivo-nft-bootstrap.sh
